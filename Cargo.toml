[package]
name = "claviron-asgi"
version = "0.2.0-alpha.26"
edition = "2024"
license = "MIT"
repository = "https://github.com/claviron/asgi"
description = "Python and ASGI embedded in Claviron: lifespan, streaming HTTP and message sessions"
keywords = ["python", "asgi", "claviron", "embedding", "websocket"]
categories = ["web-programming::http-server", "api-bindings", "asynchronous"]
autotests = false
links = "claviron_asgi"
include = ["/src/**", "/stubs/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[workspace]
resolver = "3"

[features]
default = []
broadcast = ["dep:claviron-broadcast"]
django = ["broadcast", "dep:serde"]
log = ["claviron/log-pipeline"]
# A WebSocket answered by the application, on a connection this process holds.
websocket = ["claviron/websocket", "dep:claviron-transport", "claviron-transport/websocket-session"]
# `python:` on a site's routes and the one application `python.yaml` names, for
# an Edge or any host that compiles a site. No runner comes with it.
backend = ["websocket", "dep:async-trait", "dep:claviron-pipeline", "dep:serde", "dep:serde_yaml"]

[dependencies]
bytes = "1.11"
claviron = { version = "0.2.0-alpha.26", path = "../../claviron", default-features = false, features = ["http", "application", "orbit"] }
claviron-broadcast = { version = "0.2.0-alpha.26", path = "../../backends/broadcast", optional = true }
claviron-pipeline = { version = "0.2.0-alpha.26", path = "../../claviron/crates/pipeline", optional = true }
claviron-transport = { version = "0.2.0-alpha.26", path = "../../claviron/crates/transport", optional = true }
async-trait = { version = "0.1", optional = true }
serde_yaml = { version = "0.9", optional = true }
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
percent-encoding = "2.3"
pyo3 = "0.30.1"
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
tower-service = "0.3"

[build-dependencies]
pyo3-build-config = { version = "0.30.1", features = ["resolve-config"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
